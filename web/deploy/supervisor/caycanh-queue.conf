; /etc/supervisor/conf.d/caycanh-queue.conf
[program:caycanh-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/caycanh/web/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=300
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/caycanh/web/storage/logs/queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
