; /etc/supervisor/conf.d/caycanh-ssr.conf
; Máy chủ render SSR của Inertia (Node.js), lắng nghe 127.0.0.1:13714
[program:caycanh-ssr]
command=php /var/www/caycanh/web/artisan inertia:start-ssr
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/www/caycanh/web/storage/logs/ssr.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
