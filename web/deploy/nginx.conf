# /etc/nginx/sites-available/caycanh.conf
# Thay caycanh.vn bằng tên miền thật; chứng chỉ SSL cấp bằng: certbot --nginx -d caycanh.vn -d www.caycanh.vn

server {
    listen 80;
    listen [::]:80;
    server_name caycanh.vn www.caycanh.vn;
    return 301 https://caycanh.vn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name caycanh.vn;

    root /var/www/caycanh/web/public;
    index index.php;
    charset utf-8;
    client_max_body_size 64M;

    # ssl_certificate / ssl_certificate_key được certbot tự thêm vào đây.

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Asset đã có hash trong tên file → cache lâu dài.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /storage/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
